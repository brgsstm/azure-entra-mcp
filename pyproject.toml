[project]
name = "azure-entra-mcp"
version = "0.1.0"
description = "Team MCP server for Azure and Microsoft Entra, authenticated with Entra ID and calling Graph/ARM on behalf of the signed-in user."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp[azure]>=4.1,<5",
    "py-key-value-aio[azure-tables]",
    "azure-identity>=1.27",
    "aiohttp",  # transport for azure-identity's async credentials (MI, OBO)
    "httpx2",
    "cryptography",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
azure-entra-mcp = "azure_entra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_entra_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# S = bandit security checks, B = bugbear, ASYNC = blocking calls in async code.
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "ASYNC", "C4", "PT"]
ignore = [
    "C408",                        # dict(...) reads better than a literal for kwargs bundles
    "RUF001", "RUF002", "RUF003",  # en dashes in prose are intentional
    "S104",                        # binding 0.0.0.0 is correct inside the container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are what tests are
